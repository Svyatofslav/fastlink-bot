default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.13.4
          - pydantic-settings==2.15.0
          - aiogram==3.30.0
          - aiohttp==3.14.3
          - sqlalchemy==2.0.51
          - asyncpg==0.31.0
          - alembic==1.19.1
          - httpx==0.28.1
          - redis==5.2.1
          - arq==0.28.0
          - qrcode==8.2
          - pillow==12.3.0
          - structlog==26.1.0
          - psycopg2-binary==2.9.12
          - cryptography==50.0.0
          - argon2-cffi==25.1.0
          - types-qrcode==8.2.0.20260518
          - types-redis==4.6.0.20241004
          - types-psycopg2==2.9.21.20260724
        args: [--config-file=pyproject.toml]
        exclude: ^(alembic/|tests/)

  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        args: ["-c", "tooling/bandit.yaml", "-r", "."]
        pass_filenames: false

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        name: pip-audit (runtime deps)
        args: ["-r", "requirements.txt"]
      - id: pip-audit
        name: pip-audit (dev deps)
        args: ["-r", "requirements-dev.txt"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args: ["--staged", "--config", "tooling/gitleaks.toml", "-v", "--redact"]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture

  - repo: https://github.com/osprey-oss/deptry.git
    rev: "0.25.1"
    hooks:
      - id: deptry

  - repo: https://github.com/seddonym/import-linter
    rev: "v2.13"
    hooks:
      - id: import-linter
        args: ["--config", "tooling/import-linter.cfg"]

  - repo: https://github.com/rubik/xenon
    rev: "v0.9.3"
    hooks:
      - id: xenon
        args: ["--max-absolute", "B", "--max-modules", "B", "--max-average", "A", "--exclude", "alembic/*,.venv/*,venv/*,tests/*"]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint
        args: ["--config", "tooling/.sqlfluff"]
      - id: sqlfluff-fix
        args: ["--config", "tooling/.sqlfluff"]

  - repo: local
    hooks:
      - id: check-tool-versions
        name: check pinned tool versions (node/npm/jscpd/gitleaks)
        entry: bash tooling/check-tool-versions.sh
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: jscpd
        name: duplicate code detector (jscpd)
        language: system
        entry: jscpd
        args: ["--config", "tooling/.jscpd.json"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: alembic-check
        name: alembic check (models vs migrations)
        entry: bash -c '.venv/bin/python -m alembic upgrade head && .venv/bin/python -m alembic check'
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: pytest
        name: pytest with coverage gate (min 70%)
        entry: .venv/bin/python -m pytest -q --cov --cov-report=term-missing --cov-report=xml:tests/reports/coverage.xml --cov-fail-under=70
        language: system
        pass_filenames: false
        types: [python]
