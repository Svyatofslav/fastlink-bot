[tool.coverage.run]
source = ["."]
omit = [
    "alembic/*",
    "tests/*",
    "conftest.py",
    ".venv/*",
    "venv/*",
    "webhooks/test.py",
    "services/support.py",
    "services/admin_session.py",
    "services/admin_auth.py",
    "services/node_health.py",
    "database/repo/support.py",
    "database/repo/admins.py",
    "handlers/client/support.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
]
fail_under = 70
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

explicit_package_bases = true
mypy_path = ["."]

exclude = [
    "alembic/",
    ".venv/",
    "venv/",
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "aiogram",
    "aiogram.*",
    "aiohttp",
    "aiohttp.*",
    "httpx",
    "httpx.*",
    "structlog",
    "structlog.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "alembic",
    "alembic.*",
    "apscheduler",
    "apscheduler.*",
    "qrcode",
    "qrcode.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["psycopg2", "psycopg2.*"]
ignore_missing_imports = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Use datetime.now(UTC) instead."
"typing.List".msg = "Use list[T] instead."
"typing.Dict".msg = "Use dict[K, V] instead."
"typing.Tuple".msg = "Use tuple[...] instead."
"typing.Optional".msg = "Use X | None instead."

[tool.ruff.lint]
extend-select = [
    "B",
    "BLE",
    "C4",
    "UP",
    "RUF",
    "SIM",
    "RET",
    "W",
    "TID",
    "ARG",
    "PLC0415",
    "PLW0603",
    "N",
    "S",
    "ASYNC",
    "DTZ",
    "PT",
    "PERF",
    "G",
    "FURB",
    "TC",
    "PTH",
    "ISC",
    "ICN",
    "TD",
    "I",
    "FA",
    "PIE",
    "ANN",
]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "TD002",
    "TD003",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLC0415", "S105", "S106", "S608", "ANN"]

[tool.vulture]
paths = ["bot.py", "clients", "database", "domain", "handlers", "infrastructure", "keyboards", "middlewares", "scheduler", "schemas", "services", "tasks", "utils", "webhooks", "worker.py", "config.py", "settings_schema.py"]
exclude = ["alembic/", "tests/", ".venv/"]
min_confidence = 80
