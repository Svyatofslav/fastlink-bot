name: "Trivy image scan"
description: "Scan a Docker image with Trivy: blocking on MEDIUM/HIGH/CRITICAL, non-blocking report for LOW/UNKNOWN"

inputs:
  image-ref:
    description: "Image reference to scan (local tag or registry ref)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Scan image with Trivy (blocking)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.35.0, confirmed safe post-supply-chain-compromise (2026-03)
      with:
        image-ref: ${{ inputs.image-ref }}
        severity: MEDIUM,HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        trivyignores: tooling/.trivyignore

    - name: Scan image with Trivy (report LOW/UNKNOWN, non-blocking)
      if: always()
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.35.0, confirmed safe post-supply-chain-compromise (2026-03)
      with:
        image-ref: ${{ inputs.image-ref }}
        severity: LOW,UNKNOWN
        ignore-unfixed: true
        exit-code: "0"
        trivyignores: tooling/.trivyignore
