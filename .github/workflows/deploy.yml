name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run deploy in dry-run mode"
        required: true
        default: true
        type: boolean
      confirm:
        description: "Type 'deploy' to allow real deploy (required if dry_run=false)"
        required: false
        default: ""
        type: string

  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and push deploy image
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.export.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/svyatofslav/fastlink-bot:${{ github.sha }}

      - name: Scan image with Trivy (blocking)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0, confirmed safe post-supply-chain-compromise (2026-03)
        with:
          image-ref: ghcr.io/svyatofslav/fastlink-bot:${{ github.sha }}
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: tooling/.trivyignore

      - name: Scan image with Trivy (report LOW/UNKNOWN, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0, confirmed safe post-supply-chain-compromise (2026-03)
        with:
          image-ref: ghcr.io/svyatofslav/fastlink-bot:${{ github.sha }}
          severity: LOW,UNKNOWN
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: tooling/.trivyignore

      - name: Export image ref
        id: export
        shell: bash
        run: |
          set -euo pipefail
          echo "image_ref=ghcr.io/svyatofslav/fastlink-bot@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    needs:
      - build-image

    env:
      APP_DIR: /opt/fastlink-bot
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_OPTS: -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3

      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      MARZBAN_PASSWORD: ${{ secrets.MARZBAN_PASSWORD }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      FASTLINK_CRYPTO_MASTER_KEY: ${{ secrets.FASTLINK_CRYPTO_MASTER_KEY }}

      OWNER_TELEGRAM_ID: ${{ vars.OWNER_TELEGRAM_ID }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      MARZBAN_USERNAME: ${{ vars.MARZBAN_USERNAME }}

      SUPPORT_BOT_TOKEN: ${{ secrets.SUPPORT_BOT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide deploy mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "source=push-main" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "source=manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Require confirmation for manual real deploy
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "deploy" ]]; then
            echo "ERROR: For real deploy you must set confirm='deploy'"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Runner commit info
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          COMMIT_SHORT="$(git rev-parse --short HEAD)"
          echo "RUNNER_HEAD=$COMMIT_SHA"
          echo "RUNNER_HEAD_SHORT=$COMMIT_SHORT"
          echo "DEPLOY_SOURCE=${{ steps.mode.outputs.source }}"
          echo "DRY_RUN=${{ steps.mode.outputs.dry_run }}"

      - name: Install deploy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Setup known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Prepare deploy commit short
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOY_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Generate production env file locally
        shell: bash
        run: |
          set -euo pipefail
          envsubst < .env.production.template > .env.production.generated
          test -s .env.production.generated
          if grep -n '\${[A-Za-z_][A-Za-z0-9_]*}' .env.production.generated; then
            echo "ERROR: Unresolved placeholders found in generated env file"
            exit 1
          fi
          grep -E '^(APP_ENV|USE_WEBHOOK|POSTGRES_DB|POSTGRES_USER|REDIS_HOST|MARZBAN_USERNAME|METRICS_URL|DEPLOY_COMMIT_SHORT)=' .env.production.generated

      - name: Preflight SSH and remote state
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" preflight

      - name: Remote dry-run env validation
        if: steps.mode.outputs.dry_run == 'true'
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" upload-env "$APP_DIR/.env.ci.test" < .env.production.generated
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" validate-env "$APP_DIR/.env.ci.test"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" cleanup-env "$APP_DIR/.env.ci.test"

      - name: Deploy env file to server
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" upload-env "$APP_DIR/.env.new" < .env.production.generated
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" deploy-env "$APP_DIR/.env.new"

      - name: Set deploy image
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ needs.build-image.outputs.image_ref }}"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" set-image "$IMAGE_REF"

      - name: Sync remote git repo to deployed commit
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          COMMIT_SHORT="$(git rev-parse --short HEAD)"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" sync-git "$COMMIT_SHA" "$COMMIT_SHORT"

      - name: Sync ops tooling scripts to server
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" sync-ops-tooling

      - name: Update remote Python venv dependencies
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" update-venv

      - name: Update Gitleaks on server
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" update-gitleaks

      - name: Update Node.js on server
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" update-nodejs

      - name: Update hadolint on server
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" update-hadolint

      - name: Update Trivy on server
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" update-trivy

      - name: Docker compose up
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" compose-up

      - name: Post-deploy healthcheck
        if: steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" healthcheck

      - name: Record successful deploy
        if: success() && steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" record-success "$COMMIT_SHA" "${{ steps.mode.outputs.source }}"

      - name: Cleanup old Docker images
        if: success() && steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" cleanup-images

      - name: Rollback on failure
        if: failure() && steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" rollback "${{ steps.mode.outputs.source }}"

      - name: Post-deploy service logs
        if: always() && steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" logs

      - name: Post-deploy final summary
        if: always() && steps.mode.outputs.dry_run == 'false'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" summary "$COMMIT_SHA"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts .env.production.generated
