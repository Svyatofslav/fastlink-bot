name: Sync dev with main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync dev with main
        run: |
          git fetch origin main

          if git merge-base --is-ancestor HEAD origin/main; then
            echo "dev has no unique commits - fast-forwarding to main (no new commit)."
            git merge --ff-only origin/main
          else
            echo "dev has diverged from main - merging main into dev with a merge commit."
            if ! git merge --no-edit origin/main; then
              echo "::error::Merge conflict between dev and main. Resolve manually via a PR (dev already has a commit that touches the same lines dependabot changed)."
              git merge --abort
              exit 1
            fi
          fi

          git push origin HEAD:dev
