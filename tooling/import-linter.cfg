[importlinter]
root_packages=
    handlers
    webhooks
    scheduler
    tasks
    middlewares
    services
    clients
    infrastructure
    database
    domain
    schemas
    keyboards
    states
    utils
exclude_type_checking_imports = true

[importlinter:contract:architecture-layers]
name = Layered architecture
type = layers
layers =
    handlers | webhooks
    tasks
    scheduler
    middlewares
    services
    clients | infrastructure
    domain
    database | schemas

[importlinter:contract:ui-independence]
name = UI/util layers must not depend on business logic
type = forbidden
source_modules =
    keyboards
    states
    utils
forbidden_modules =
    handlers
    webhooks
    scheduler
    tasks
    middlewares
    services
    clients
    infrastructure
    database
ignore_imports =
    keyboards.client -> database.enums
